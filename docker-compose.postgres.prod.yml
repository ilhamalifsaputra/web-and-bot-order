# Production Postgres, layered onto docker-compose.yml (NOT a replacement for
# it — docker-compose.yml still defines the `server` service and its base
# config; this file only adds the `postgres` service and a `depends_on` onto
# `server`). NOTE: docker-compose.yml alone does not include a database —
# prisma/schema.prisma's provider is `postgresql`, so `server` needs a
# reachable Postgres regardless of whether this overlay is applied.
# Apply both together:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.prod.yml up -d
#
# (Compose merges services with the same name across -f files, and adds new
# ones — here it adds `postgres` and layers a `depends_on` onto `server`.)
#
# Distinct from docker-compose.postgres.yml (Task 1's dev/local file, used only
# to validate this migration inside a worktree): that file publishes
# 127.0.0.1:55432 for local `psql`/tooling convenience and uses throwaway
# credentials. This file is what a VPS actually runs, and differs on purpose:
#   - No host port published at all. `server` reaches Postgres over the
#     internal Compose network by service name (postgres:5432) — nothing
#     outside the Docker network needs to reach Postgres directly. nginx
#     stays the only public surface, same as docker-compose.yml's own
#     convention for the app ports.
#   - `postgres`'s data volume is named (not bind-mounted), and — like every
#     other resource in docker-compose.yml — Compose automatically prefixes
#     volume/container names with COMPOSE_PROJECT_NAME, so two independent
#     shops running from two repo directories on the same host each get their
#     own isolated Postgres data too (confirmed via `docker compose config`:
#     the volume resolves to `<project>_postgres_data`).
#   - `env_file` is intentionally NOT set on `postgres` here (unlike `server`'s
#     `env_file: .env` in docker-compose.yml): the Postgres container only
#     ever needs POSTGRES_DB/USER/PASSWORD, so those three are passed via
#     `environment:` (substituted from the project's .env, which Compose reads
#     automatically for variable interpolation regardless of `env_file:`)
#     rather than handing the whole app .env — with every payment-gateway and
#     bot secret in it — to a container that has no use for any of it.
#
# Required .env variables (documented with an example block in .env.example):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   DATABASE_URL_PRISMA=postgresql://<user>:<password>@postgres:5432/<db>
#     The host MUST be the service name `postgres`, not localhost/127.0.0.1 —
#     that only resolves because Compose puts `server` and `postgres` on the
#     same internal project network and DNS-resolves service names there.
#
# SCHEMA APPLICATION IS AUTOMATIC with this file. docker-entrypoint.sh's
# auto_migrate() handles the postgresql:// path in full, before `pnpm start`
# runs, on every start path (`up`, `restart`, and the automatic restart after a
# crash):
#
#   1. waits briefly for the datasource to answer a query — the `depends_on:
#      service_healthy` below proves `pg_isready` succeeded, not that a
#      first-boot Postgres container has finished restarting its real server;
#   2. `prisma db push --skip-generate`, never with --accept-data-loss: a change
#      that would drop rows fails the push and the container refuses to start;
#   3. seeds the ledger chart of accounts (scripts/seed-chart-of-accounts.ts).
#      Every ledger posting resolves its account by `code`, so without those
#      rows settlements, wallet top-ups and referral commissions record nothing;
#   4. applies the release's data-only migrations (the $DATA_MIGRATIONS list in
#      docker-entrypoint.sh) — `db push` only ever syncs structure, so a
#      migration that seeds or backfills ROWS has to be executed separately.
#
# Steps 3 and 4 only WARN on failure and start-up continues: the schema push has
# already succeeded by then, and a container that refuses to start cannot be used
# to repair anything. So read the entrypoint lines after every deploy:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.prod.yml \
#     logs --since 10m server | grep entrypoint
#
# Deploying a new release therefore needs nothing more than:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.prod.yml up -d --build
#
# The React SPA bundles are built by the Dockerfile's builder stage, so `--build`
# covers those too — there is no separate client build step on the Docker path.
#
# OPTING OUT: set AUTO_MIGRATE=0 in .env (docker-compose.yml passes it through to
# the container) and the entrypoint leaves the database alone; deploy/backup/restore.sh
# achieves the same for one boot with its data/SKIP_AUTO_MIGRATE sentinel, so a
# restored database is not migrated forward again. Either way the steps become
# yours to run:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.prod.yml \
#     run --rm server pnpm exec prisma db push --schema prisma/schema.prisma
#   docker compose -f docker-compose.yml -f docker-compose.postgres.prod.yml \
#     run --rm server pnpm seed-chart-of-accounts
#
# NO PRE-DEPLOY SNAPSHOT is taken on this path. deploy/backup/backup.sh's Postgres
# branch dumps by running `pg_dump` INSIDE this `postgres` container via
# `docker compose exec`, which needs a Docker socket the `server` container does
# not have — and postgresql-client installed into the app image would be older
# than the postgres:16 server here, producing dumps this server rejects. Take the
# dump on the HOST before deploying: see "Backup — Postgres" in
# deploy/backup/README.md. What the entrypoint does guarantee is that `db push`
# refuses any change it cannot apply without dropping data.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bot_order}
      POSTGRES_USER: ${POSTGRES_USER:-bot_order}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` — production reaches Postgres only via the internal Compose
    # network (postgres:5432), never from the host or the public internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_order} -d ${POSTGRES_DB:-bot_order}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  server:
    # Layered onto docker-compose.yml's `server` service: don't start the app
    # container until Postgres is actually ready to accept connections, not
    # merely running (a fresh Postgres container needs a moment after start
    # before `pg_isready` succeeds).
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
