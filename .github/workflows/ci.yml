name: CI

# Gate regresi: typecheck + test pada setiap PR dan push ke master.
# Dinonaktifkan sementara — akun GitHub Actions terkunci karena masalah billing
# (semua run gagal instan dengan "account is locked due to a billing issue").
# Pulihkan trigger pull_request/push di bawah setelah billing diselesaikan.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # engine-swap: schema.prisma is Postgres-only now, and every test
    # bootstrap file (tests/helpers/pgTestSchema.ts) provisions its own
    # schema inside whatever DATABASE_URL_PRISMA points at via `prisma db
    # push` — so the job needs a real reachable Postgres, not just a env var.
    # `pretest`'s migration-drift check (scripts/check-migration-drift.ts)
    # also needs one, for its `--shadow-database-url`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bot_order
          POSTGRES_USER: bot_order
          POSTGRES_PASSWORD: bot_order_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_order -d bot_order"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_PRISMA: postgresql://bot_order:bot_order_ci@localhost:5432/bot_order
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Push schema to CI Postgres
        run: pnpm exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Migration drift check
        run: pnpm run check-migration-drift

      - name: Migration timestamp collision check
        run: pnpm run check-migration-timestamps

      - name: Migration rebuild column-quoting check
        run: pnpm run check-migration-rebuild-quoting

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: npx vitest run

      # Known-failing today: 27 pre-existing tests across 7 files call
      # decryptCredentials/encryptCredentials without the context/AAD
      # argument v2 writes need (see tests/helpers/envelopeFlag.ts's comment;
      # full breakdown in .superpowers/sdd/task-E-report.md):
      #   packages/core/src/credentialCrypto.test.ts        4
      #   packages/db/src/crud/settlePaidOrder.test.ts       2
      #   packages/db/src/crud/stock.test.ts                11
      #   packages/db/src/crud/stockReplacement.test.ts      1
      #   packages/db/src/crud/stock_concurrency.test.ts     3
      #   packages/db/src/crud/stock_events.test.ts          2
      #   scripts/reencrypt-credentials-v2.test.ts           4
      # continue-on-error keeps this step's failure visible in the run
      # without blocking every other PR on debt this step was never meant to
      # fix — flip back to hard-fail once all 27 of the above are fixed (each
      # call site given a real derived context, or pinned to v1 via
      # encryptLegacyV1 where that's the actual intent).
      - name: Test (CREDENTIAL_ENVELOPE_WRITE_V2 coverage)
        run: pnpm run test:envelope-v2
        continue-on-error: true
