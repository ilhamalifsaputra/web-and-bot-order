# Compose for the Node stack's `server` service. ONE image, ONE process.
# NOTE: prisma/schema.prisma's provider is `postgresql` unconditionally
# (engine-swap migration) — this file alone does not include a `postgres`
# service, so `server` needs a reachable Postgres from elsewhere (either
# docker-compose.postgres.prod.yml layered on top for a real deploy, or an
# externally-reachable Postgres referenced by DATABASE_URL_PRISMA).
# `./data` is bind-mounted below for logs, uploads, the credential key and
# backups (deploy/backup/), not for a live DB.
#
# ONE combined process. `pnpm start` (apps/server) is the composition root: it
# boots the web-admin, the storefront, the order-bot (polling/webhook), AND the
# in-process workers — the outbox dispatcher (@app/outbox-dispatcher, which drains
# notification_outbox → Telegram) and the payment-reconcile pollers. A single
# process guarantees each worker runs exactly once.
#
# This replaces the previous split per-app services (order-bot / web-admin /
# storefront / notifier). Outbox delivery only happens inside this combined
# process, so the standalone notifier service is gone.
#
#   docker compose up -d            # bring the whole stack up
#   docker compose logs -f server   # tail logs
#
# IMPORTANT: never run the Python order-bot and the Node
# order-bot against the same DB simultaneously — two order-flow writers corrupt
# state.
#
# MULTI-INSTANCE: container names are NOT hardcoded — Compose derives them from
# COMPOSE_PROJECT_NAME (set per .env), so two independent shops can run on one
# host from two repo directories (e.g. /opt/trustance + /opt/trustoriax) with
# their own .env, ./data, ports, and bot tokens. Published ports bind to
# 127.0.0.1 only; nginx is the sole public surface (deploy/README.md).

services:
  server:
    build:
      context: .
    image: bot-order-node:latest
    restart: unless-stopped
    command: ["pnpm", "start"]
    # required: false — credentials (bot token, Binance/Bybit UID+keys) live in
    # web-admin Settings now, not `.env`, so a missing `.env` file must not
    # block `docker compose up`. Needs Docker Compose v2.24+ (Jan 2024).
    env_file:
      - path: .env
        required: false
    # Bind 0.0.0.0 inside the container (config default is 127.0.0.1) so the
    # published ports reach the app.
    environment:
      WEB_HOST: "0.0.0.0"
      # The entrypoint applies pending schema changes before the app starts, so a deploy can never run new code against an old
      # schema. Set AUTO_MIGRATE=0 in .env to take that over manually — see
      # docs/MIGRATIONS.md. deploy/backup/restore.sh pauses it via a sentinel
      # file instead, so a rollback is not migrated forward again.
      AUTO_MIGRATE: "${AUTO_MIGRATE:-1}"
    volumes:
      - ./data:/app/data
    # Publish to the host loopback ONLY — nginx terminates TLS and proxies in.
    # Admin always listens on WEB_PORT; the storefront listens on STOREFRONT_PORT
    # (unless SHOP_PUBLIC_URL routes both through WEB_PORT by Host header).
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:${WEB_PORT:-8000}"
      - "127.0.0.1:${STOREFRONT_PORT:-8100}:${STOREFRONT_PORT:-8100}"
    # Probes /healthz, which reads one row from the settings table, so
    # "healthy" means the app can actually reach PostgreSQL — not just that
    # Fastify answers (the previous /login probe stayed green with the database
    # down). /healthz is public: no session, and the first-run setup gate skips
    # it (apps/web-admin/src/plugins/setupGate.ts). Its lookup goes through the
    # 30-second settings cache, so a database outage shows up within one probe
    # interval rather than instantly. A 127.0.0.1 Host header always reaches the
    # admin app, also in the single-port SHOP_PUBLIC_URL mode.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.WEB_PORT||8000)+'/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
